name: ci
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: PSScriptAnalyzer || true
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer || true)) {
            Install-Module -Force -Scope CurrentUser PSScriptAnalyzer || true
          }
          $files = Get-ChildItem -Recurse -Include *.ps1,*.psm1,*.psd1
          if ($files) {
            Invoke-ScriptAnalyzer -Path $files -Severity Error | Format-Table -AutoSize
          } else {
            Write-Host 'No PowerShell files found.'
          }
